<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>みらい商事 社内ポータル（訓練用）</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="trainbar">⚠️ これはセキュリティ学習用の<strong>架空の訓練サイト</strong>です。表示される会社名・氏名・データはすべてダミーです。</div>
<header class="site">
  <div class="logo">みらい商事株式会社</div>
  <div class="sub">社内ポータル / Employee Portal</div>
</header>
<nav class="main">
  <a href="index.html">ホーム</a>
  <a href="challenge.html">チャレンジ選択</a>
</nav>
<div class="progress" id="progress">チャレンジ　点々のパスワード</div>
<div class="wrap">
  <div class="card">
    <h2>仮パスワードの連絡</h2>
    <p>新入社員向けの仮パスワードを、下の欄に入れてあります。点々を、文字として見えるようにしてみてください。</p>
    <div class="stack">
      <label for="tempPw">仮パスワード</label>
      <input id="tempPw" type="password" readonly autocomplete="off" spellcheck="false">
    </div>
  </div>

  <div class="card stack" id="answer">
    <h2>フラグを入力</h2>
    <p class="muted">見えた <code>FLAG{ }</code> の中のキーワードだけを入力してください。</p>
    <form id="flagForm" autocomplete="off">
      <label for="flagInput">キーワード</label>
      <input id="flagInput" class="flag-input" type="text" autocomplete="off" spellcheck="false" autocapitalize="off" placeholder="キーワード">
      <button class="btn" type="submit">回答する</button>
    </form>
    <div id="flagResult" class="result" role="status" aria-live="polite"></div>
  </div>
</div>
<footer class="site">© みらい商事株式会社（架空）｜訓練用サンドボックス</footer>
<script src="js/mask-fill.js"></script>
<script src="js/gate.js"></script>
<script src="js/mask-check.js"></script>
</body>
</html>
